name: Build and release

# Rebuild Tap Tap Phoenix for modern iOS and publish the sideload IPA on
# the GitHub release. (GitHub-only distribution for this project — no
# TestFlight.) Triggered by v* tags and manually; either way the IPA is
# attached to the v0.5.1 release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ORIGINAL_IPA_URL: https://github.com/tapphoenix/taptapphoenix/releases/download/v1.00/TapTapPhoenix_1.00.ipa
  ORIGINAL_IPA_SHA256: 89e876c292091f577f763ba71734c7f46796ffc51e8a4e9df5e22f2f2f50a4c7
  UTMT_URL: https://github.com/UnderminersTeam/UndertaleModTool/releases/download/0.9.2.0/UTMT_CLI_v0.9.2.0-Ubuntu.zip
  IPA_NAME: TapTapPhoenix-c12n-0.5.1.ipa
  RELEASE_TAG: v0.5.1

jobs:
  build:
    name: Assemble sideload IPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install lief

      - name: Download and verify the original IPA
        run: |
          curl -sL -o TapTapPhoenix_1.00.ipa "$ORIGINAL_IPA_URL"
          echo "$ORIGINAL_IPA_SHA256  TapTapPhoenix_1.00.ipa" | sha256sum -c -

      - name: Extract game data
        run: |
          mkdir -p extracted_full
          unzip -o -q TapTapPhoenix_1.00.ipa "Payload/TapTapPhoenix.app/games/game.ios" -d extracted_full

      - name: Download UndertaleModTool CLI
        run: |
          curl -sL -o utmt.zip "$UTMT_URL"
          mkdir -p utmt && unzip -o -q utmt.zip -d utmt
          chmod +x utmt/UndertaleModCli

      - name: Decode the patched artwork
        run: |
          base64 -d tools/spr_Credits_new.png.b64 > tools/spr_Credits_new.png
          for f in tools/hc/*.b64; do base64 -d "$f" > "${f%.b64}"; done
          base64 -d tools/custom/lilgodd.wav.b64 > tools/custom/lilgodd.wav
          ls -la tools/hc/

      - name: Patch artwork into the game data (credits + high-contrast pack)
        run: |
          sed -i "s|__WORKSPACE__|$GITHUB_WORKSPACE|g" tools/import_all.csx
          ./utmt/UndertaleModCli load extracted_full/Payload/TapTapPhoenix.app/games/game.ios \
            -s tools/import_all.csx -o step1.ios -f < /dev/null

      - name: Add custom songs (embedded audio)
        run: |
          sed -i "s|__WORKSPACE__|$GITHUB_WORKSPACE|g" tools/add_songs.csx
          ./utmt/UndertaleModCli load step1.ios \
            -s tools/add_songs.csx -o step1b.ios -f < /dev/null

      - name: Patch code (server URL + forgiving timing windows)
        run: |
          ./utmt/UndertaleModCli replace step1b.ios -o step2.ios \
            -c "gml_GlobalScript_update_score=./tools/patch_gml/gml_GlobalScript_update_score.gml" \
            -c "gml_Object_obj_AccountMenu_Gesture_64=./tools/patch_gml/gml_Object_obj_AccountMenu_Gesture_64.gml" \
            -c "gml_Object_obj_LeaderboardMenu_Create_0=./tools/patch_gml/gml_Object_obj_LeaderboardMenu_Create_0.gml" \
            -c "gml_Object_obj_SongStatsMenu_Gesture_64=./tools/patch_gml/gml_Object_obj_SongStatsMenu_Gesture_64.gml" \
            < /dev/null

      - name: Patch code v0.3.1 (stats readout safe area)
        run: |
          ./utmt/UndertaleModCli replace step2.ios -o step3.ios \
            -c "gml_Object_obj_songStats_Draw_64=./tools/patch_gml_v3/gml_Object_obj_songStats_Draw_64.gml" \
            < /dev/null

      - name: Patch code v0.5.1 (hidden song, No Fail mode, progress bar, song lengths, HUD safe area)
        run: |
          ./utmt/UndertaleModCli replace step3.ios -o step4.ios \
            -c "gml_Object_obj_Conductor_Draw_64=./tools/patch_gml_v4/gml_Object_obj_Conductor_Draw_64.gml" \
            -c "gml_Object_obj_MainMenu_Other_10=./tools/patch_gml_v4/gml_Object_obj_MainMenu_Other_10.gml" \
            -c "gml_Object_obj_MainMenu_Create_0=./tools/patch_gml_v4/gml_Object_obj_MainMenu_Create_0.gml" \
            -c "gml_Object_obj_MainMenu_Gesture_64=./tools/patch_gml_v4/gml_Object_obj_MainMenu_Gesture_64.gml" \
            -c "gml_Object_obj_BackgroundMenu_Create_0=./tools/patch_gml_v4/gml_Object_obj_BackgroundMenu_Create_0.gml" \
            -c "gml_Object_obj_BackgroundMenu_Gesture_64=./tools/patch_gml_v4/gml_Object_obj_BackgroundMenu_Gesture_64.gml" \
            -c "gml_Object_obj_Conductor_Create_0=./tools/patch_gml_v4/gml_Object_obj_Conductor_Create_0.gml" \
            -c "gml_GlobalScript_missed_note=./tools/patch_gml_v4/gml_GlobalScript_missed_note.gml" \
            -c "gml_Object_obj_SongStatsMenu_Gesture_64=./tools/patch_gml_v4/gml_Object_obj_SongStatsMenu_Gesture_64.gml" \
            < /dev/null

      - name: Patch code v0.5.1 (custom song catalog + lengths)
        run: |
          ./utmt/UndertaleModCli replace step4.ios -o patched_game.ios \
            -c "gml_Object_obj_MainMenu_Create_0=./tools/patch_gml_v5/gml_Object_obj_MainMenu_Create_0.gml" \
            -c "gml_Object_obj_MainMenu_Other_10=./tools/patch_gml_v5/gml_Object_obj_MainMenu_Other_10.gml" \
            < /dev/null

      - name: Assemble the IPA
        run: python3 patch_ipa.py

      - name: Verify the IPA
        run: |
          python3 - << 'PY'
          import plistlib, zipfile, lief
          z = zipfile.ZipFile("TapTapPhoenix-c12n-0.5.1.ipa")
          names = z.namelist()
          assert "Payload/TapTapPhoenix.app/PrivacyInfo.xcprivacy" in names
          assert not any("_CodeSignature" in n or "embedded.mobileprovision" in n for n in names)
          info = plistlib.loads(z.read("Payload/TapTapPhoenix.app/Info.plist"))
          assert info["CFBundleIdentifier"] == "com.c12n.taptapphoenix", info["CFBundleIdentifier"]
          assert info["CFBundleShortVersionString"] == "0.5.1", info["CFBundleShortVersionString"]
          assert info["MinimumOSVersion"] == "15.0"
          open("/tmp/runner.bin", "wb").write(z.read("Payload/TapTapPhoenix.app/TapTapPhoenix"))
          fat = lief.MachO.parse("/tmp/runner.bin")
          archs = [str(b.header.cpu_type) for b in fat]
          assert archs == ["CPU_TYPE.ARM64"], archs
          print("IPA verified:", info["CFBundleShortVersionString"], archs)
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideload-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Attach IPA to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || env.RELEASE_TAG }}
          files: ${{ env.IPA_NAME }}
          body: |
            Tap Tap Phoenix v0.5.1 — remade for modern iOS by c12n Apps.

            New in this build:
            - First custom song added: "The 6 7 Song" by Lil Godd (Easy, 1:56) — audio embedded into the game data and a chart generated from the track, with leaderboard support and a score cap like the built-in songs
            - v0.5.1 fixes the custom song playing in silence: the audio is now embedded as uncompressed WAV, the same format the original songs use

            From v0.4.0:
            - A hidden 24th song unlocked: "Legend ft Backchat" by Jaroslav Beck (Easy) — its audio and chart were inside the game all along, but the original developers never added it to the catalog
            - No Fail practice mode: a new Options toggle. Misses still show, but they no longer reset your combo or multiplier, and No Fail runs are not registered on the leaderboard
            - A progress bar under the in-song HUD shows how far through the song you are
            - Server side: leaderboard scores are now capped at each chart's true maximum, so forged scores are rejected


            From v0.2.0:
            - Accounts and the online leaderboard work again — the original server is gone, so the game now talks to a c12n-hosted revival of the same endpoints
            - Accessibility pack: more forgiving hit timing (Perfect and Great windows roughly doubled) and high-contrast notes — white-ringed orbs on darkened backgrounds

            - arm64-only build, minimum iOS 15.0, privacy manifest included
            - original credits kept, with a c12n Apps line added at the bottom
            - unsigned sideload IPA — sign it with Feather, SignLab, AltStore or your tool of choice
